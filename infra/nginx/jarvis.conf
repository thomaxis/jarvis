# Jarvis Brain - Nginx reverse proxy
# TLS termination + WebSocket upgrade + rate limiting

upstream brain {
    server 127.0.0.1:8400;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=brain_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=brain_conn:10m;

server {
    listen 80;
    server_name jarvis.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jarvis.yourdomain.com;

    # TLS (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/jarvis.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request size limit
    client_max_body_size 10m;

    # Rate limiting
    limit_req zone=brain_api burst=50 nodelay;
    limit_conn brain_conn 20;

    # WebSocket endpoint
    location /ws {
        proxy_pass http://brain;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;  # 24h for long-lived WS connections
        proxy_send_timeout 86400;
    }

    # REST API
    location / {
        proxy_pass http://brain;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (no rate limit)
    location = /health {
        limit_req off;
        proxy_pass http://brain;
    }
}
